name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME#v}" ./build.sh
          cd build
          ditto -c -k --keepParent "Browser Picker.app" "BrowserPicker-${GITHUB_REF_NAME#v}.zip"
          shasum -a 256 "BrowserPicker-${GITHUB_REF_NAME#v}.zip" | tee sha256.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/BrowserPicker-${GITHUB_REF_NAME#v}.zip" \
            --title "$GITHUB_REF_NAME" --generate-notes

      # The cask pins version and checksum, so every release rewrites it on main.
      - name: Update Homebrew cask
        run: |
          version="${GITHUB_REF_NAME#v}"
          sha="$(cut -d' ' -f1 build/sha256.txt)"
          sed -i '' -e "s/^  version \".*\"/  version \"$version\"/" \
                    -e "s/^  sha256 \".*\"/  sha256 \"$sha\"/" Casks/browserpicker.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/browserpicker.rb
          git commit -m "cask: $GITHUB_REF_NAME" || exit 0
          git push origin HEAD:main
