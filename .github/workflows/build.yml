name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh
      - run: lipo -info "build/Browser Picker.app/Contents/MacOS/BrowserPicker"
      - run: codesign --verify --deep --strict "build/Browser Picker.app"
